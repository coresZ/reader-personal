name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建平台（只想要便携版选 Windows 即可）
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
        default: windows
      publish:
        description: 构建成功后发布 GitHub Release（取消草稿并标为 latest）
        type: boolean
        default: true
      skip_tests:
        description: 跳过前端/Rust 测试以加快构建
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.event.inputs.platforms || 'tag' }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      do_publish: ${{ steps.release.outputs.do_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve platforms matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          # tag 推送：全平台；手动：按选择
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] || [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            choice="all"
          else
            choice="${{ github.event.inputs.platforms || 'windows' }}"
          fi

          windows='{"os":"windows-latest","platform":"windows","arch":"x64","target":"x86_64-pc-windows-msvc","rust_targets":"x86_64-pc-windows-msvc","bundles":"nsis"}'
          linux='{"os":"ubuntu-22.04","platform":"linux","arch":"x64","target":"x86_64-unknown-linux-gnu","rust_targets":"x86_64-unknown-linux-gnu","bundles":"appimage,deb"}'
          macos='{"os":"macos-latest","platform":"macos","arch":"universal","target":"universal-apple-darwin","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","bundles":"dmg"}'

          case "$choice" in
            windows) include="[$windows]" ;;
            linux)   include="[$linux]" ;;
            macos)   include="[$macos]" ;;
            all)     include="[$windows,$linux,$macos]" ;;
            *)
              echo "Unknown platforms: $choice" >&2
              exit 1
              ;;
          esac

          echo "platforms=$choice"
          echo "matrix=$(jq -c -n --argjson include "$include" '{include:$include}')" >> "$GITHUB_OUTPUT"

      - name: Resolve Release target
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] || [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            do_publish="true"
          else
            # 手动：默认用当前代码版本；若已有同名 Release 则复用
            ver="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version" 2>/dev/null || true)"
            if [[ -z "${ver}" ]]; then
              ver="$(node -p "require('./frontend/package.json').version")"
            fi
            release_tag="v${ver}"
            do_publish="${{ github.event.inputs.publish || 'true' }}"
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "Unable to resolve release tag" >&2
            exit 1
          fi

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating draft Release $release_tag"
            if ! gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Reader $release_tag" \
              --generate-notes; then
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --draft \
                --title "Reader $release_tag" \
                --notes "Desktop build for $release_tag"
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "do_publish=$do_publish" >> "$GITHUB_OUTPUT"
          echo "Release target: $release_tag (publish=$do_publish)"

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-release.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
        run: node scripts/check-release-metadata.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        if: ${{ github.event_name == 'push' || github.event.inputs.skip_tests != 'true' }}
        working-directory: frontend
        run: npm test -- --run

      - name: Test Rust core
        if: ${{ github.event_name == 'push' || github.event.inputs.skip_tests != 'true' }}
        run: cargo test --lib -j 4

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        env:
          CARGO_BUILD_JOBS: 4
        run: npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Collect release artifacts
        env:
          TAURI_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/collect-desktop-artifacts.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ needs.prepare-release.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Upload platform files to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.release_tag }}" release/* --clobber

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - build
    if: ${{ always() && needs.build.result == 'success' && needs.prepare-release.outputs.do_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish completed Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
